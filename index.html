<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلیر موزیک داش دیمن</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b131d;
            font-family: Tahoma, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .music-card {
            background: #14213d;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 85%;
            max-width: 340px;
            text-align: center;
        }
        .cover-img {
            width: 110px;
            height: 110px;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid #ffd700;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        h3 {
            font-size: 16px;
            color: #ffd700;
            margin: 5px 0;
        }
        p {
            font-size: 12px;
            color: #cbd5e1;
            margin: 0 0 20px 0;
        }
        /* پلیر استاندارد و حرفه‌ای موزیک */
        audio {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="music-card">
        <!-- کاور یا عکس سلطنتی -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Reza_Shah_Pahlavi_in_military_uniform.jpg" alt="Cover" class="cover-img">
        
        <!-- اطلاعات آهنگ -->
        <h3>Hossein Tiem - Pistol</h3>
        <p>موزیک ویژه در پایگاه داش دیمن</p>

        <!-- پلیر اصلی با لینک مستقیم آهنگ شما -->
        <audio controls preload="metadata">
            <source src="https://irsv.upmusics.com/singletracks/2026/06/Hossein%20Tiem%20-%20Pistol%20UpMusics.mp3" type="audio/mp3">
            مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
        </audio>
    </div>

</body>
</html>
